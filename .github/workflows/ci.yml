name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # next build (frontend typecheck) + tsc --noEmit (server typecheck)
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start server (production mode)
        run: |
          NODE_ENV=production npm start > server.log 2>&1 &
          echo $! > server.pid
      - name: Wait for server readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then
              echo "server ready after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::server did not become ready in 120s"
          cat server.log
          exit 1
      - name: Run protocol e2e
        run: |
          node server/scripts/e2e-m2.js
          node server/scripts/e2e-reveal-to.js
          node server/scripts/e2e-security.js
      - name: Dump server log
        if: failure()
        run: cat server.log
      - name: Stop server
        if: always()
        run: kill $(cat server.pid) 2>/dev/null || true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: cardessa:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
